name: Release

on:
  release:
    types:
      - published

jobs:
  build_extension:
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: Install latest
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cargo Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/live_radio.dll
          if-no-files-found: error
          retention-days: 30
  package:
    needs: build_extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: x86_64-pc-windows-msvc
      - run: mv live_radio.dll live_radio_x64.dll
      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
        with:
          version: "v1.22.0"
      - name: Build
        run: hemtt release
      - uses: actions/upload-artifact@v6
        with:
          name: live_radio.zip
          path: "releases/live_radio-latest.zip"
      # Upload to GitHub
      - uses: softprops/action-gh-release@v2
        id: gh_release
        with:
          files: "releases/live_radio-latest.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Upload to Steam Workshop
      - run: unzip releases/live_radio-latest.zip -d ./unzipped
      - uses: arma-actions/workshop-upload@v1
        with:
          itemId: "2172022102" # Id of item to update
          contentPath: "unzipped/@live_radio"
          changelog: #{{ steps.gh_release.outputs.url }}
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
